server {
    listen 80;
    server_name facemini.com;

    access_log /www/wwwlogs/facemini.com.log;
    error_log /www/wwwlogs/facemini.com.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /home/www/AI_workbase/frontend-app/dist;
        try_files $uri =404;
    }

    return 301 https://www.facemini.com$request_uri;
}

server {
    listen 80;
    server_name www.facemini.com;

    root /home/www/AI_workbase/frontend-app/dist;
    index index.html;

    access_log /www/wwwlogs/www.facemini.com.log;
    error_log /www/wwwlogs/www.facemini.com.error.log;

    client_max_body_size 250m;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /health {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~* \.mjs$ {
        types {
            application/javascript mjs;
        }
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|mp4|webm|woff2?|ttf|otf)$ {
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name facemini.com;

    ssl_certificate /www/server/panel/vhost/letsencrypt/facemini.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/letsencrypt/facemini.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    return 301 https://www.facemini.com$request_uri;
}

