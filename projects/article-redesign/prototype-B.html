<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>爆款图文 �?画布吸附�?/title>
  <style>
    :root {
      --bg: #0a0a0c;
      --surface: #111115;
      --surface-2: #17171c;
      --border: #1e1e24;
      --border-2: #2a2a32;
      --accent: #14b8a6;
      --accent-dim: rgba(20,184,166,0.15);
      --accent-2: #0d9488;
      --text: #f0f0f5;
      --text-2: #a0a0b5;
      --text-3: #6a6a7a;
      --danger: #ef4444;
      --warn: #f59e0b;
      --radius: 8px;
      --radius-lg: 12px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    /* ─── Layout ─── */
    .app { max-width: 1280px; margin: 0 auto; padding: 0 24px 80px; }

    /* ─── Topbar ─── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 0 16px;
      border-bottom: 1px solid var(--border);
    }
    .topbar-title { font-size: 20px;  letter-spacing: -0.3px; }
    .topbar-right { display: flex; align-items: center; gap: var(--space-4); }
    .credit-badge {
      font-size: 13px;
      color: var(--text-2);
      padding: 5px 12px;
      border: 1px solid var(--border-2);
      border-radius: var(--radius-2xl);
    }
    .credit-badge strong { color: var(--accent); margin-left: 4px; }
    .btn-ghost {
      display: flex; align-items: center; gap: var(--space-1);
      font-size: 13px; color: var(--text-2);
      background: none; border: none; cursor: pointer;
      padding: 6px 12px;
      border-radius: var(--radius);
      transition: color 0.15s, background 0.15s;
    }
    .btn-ghost:hover { color: var(--text); background: var(--surface-2); }

    /* ─── Tabs ─── */
    .tabs { display: flex; gap: var(--space-0); padding: 16px 0 0; }
    .tab-btn {
      font-size: 14px; color: var(--text-3);
      background: none; border: none; cursor: pointer;
      padding: 8px 16px; border-radius: var(--radius);
      transition: color 0.15s, background 0.15s;
    }
    .tab-btn.is-active { color: var(--text); background: var(--surface-2); }
    .tab-btn:hover:not(.is-active) { color: var(--text-2); }

    /* ─── Canvas Zone ─── */
    .canvas-zone {
      margin-top: 16px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      overflow: hidden;
      min-height: 360px;
      position: relative;
      background: var(--surface);
      display: flex;
      flex-direction: column;
    }
    .canvas-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-3);
      padding: 48px;
    }
    .canvas-empty-icon {
      width: 56px; height: 56px;
      border-radius: var(--radius-lg);
      border: 1px dashed var(--border-2);
      display: flex; align-items: center; justify-content: center;
      color: var(--text-3);
    }
    .canvas-empty h3 { font-size: 16px;  color: var(--text-2); }
    .canvas-empty p { font-size: 13px; color: var(--text-3); }

    /* Selected state */
    .canvas-selected { display: none; flex: 1; position: relative; overflow: hidden; }
    .canvas-selected.is-visible { display: flex; flex-direction: column; }
    .canvas-preview-wrap {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
      padding: 32px;
      background: var(--bg);
    }
    .canvas-preview {
      width: 320px;
      border-radius: var(--radius-control);
      aspect-ratio: 16/9;
      overflow: hidden;
      position: relative;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.06);
      transition: all 0.3s ease;
    }
    .canvas-preview.thumb { aspect-ratio: 9/16; }
    .canvas-preview.square { aspect-ratio: 1/1; }
    .canvas-preview.thumb-vertical { aspect-ratio: 3/4; }
    .canvas-preview .preview-label {
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
      font-size: 13px; color: rgba(255,255,255,0.9);
      background: rgba(0,0,0,0.5); padding: 4px 12px; border-radius: var(--radius-2xl);
      white-space: nowrap;
    }
    .canvas-meta {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      display: flex; align-items: center; gap: var(--space-4);
    }
    .canvas-meta-title { font-size: 15px;  }
    .canvas-meta-tags { display: flex; gap: var(--space-1); flex-wrap: wrap; flex: 1; }
    .tag {
      font-size: 11px; padding: 3px 8px;
      border-radius: var(--radius-2xl);
      background: var(--accent-dim); color: var(--accent);
      border: 1px solid rgba(20,184,166,0.2);
    }
    .tag.layout { background: rgba(168,85,247,0.12); color: #a855f7; border-color: rgba(168,85,247,0.2); }
    .tag.palette { background: rgba(245,158,11,0.12); color: #f59e0b; border-color: rgba(245,158,11,0.2); }
    .btn-clear {
      font-size: 12px; color: var(--text-3);
      background: none; border: none; cursor: pointer;
      padding: 4px 10px; border-radius: var(--radius);
      transition: color 0.15s, background 0.15s;
    }
    .btn-clear:hover { color: var(--danger); background: rgba(239,68,68,0.1); }

    /* ─── Template Gallery ─── */
    .gallery-section { margin-top: 24px; }
    .gallery-head {
      display: flex; align-items: center; gap: var(--space-3);
      margin-bottom: 14px;
    }
    .gallery-head h2 { font-size: 15px;  }
    .gallery-head span { font-size: 12px; color: var(--text-3); }

    /* Content type filter tabs */
    .type-tabs { display: flex; gap: var(--space-1); flex-wrap: wrap; margin-bottom: 14px; }
    .type-tab {
      font-size: 12px; padding: 5px 12px;
      border-radius: var(--radius-2xl); border: 1px solid var(--border-2);
      background: none; color: var(--text-2); cursor: pointer;
      transition: all 0.15s;
    }
    .type-tab.is-active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
    .type-tab:hover:not(.is-active) { border-color: var(--border-2); color: var(--text); }

    /* Template Grid */
    .template-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: var(--space-3);
    }
    @media (max-width: 1024px) { .template-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 768px) { .template-grid { grid-template-columns: repeat(2, 1fr); } }

    .tpl-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tpl-card:hover {
      transform: translateY(-3px);
      border-color: var(--border-2);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .tpl-card.is-selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(20,184,166,0.3), 0 4px 20px rgba(20,184,166,0.15);
    }
    .tpl-thumb {
      aspect-ratio: 16/9;
      position: relative;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .tpl-thumb-inner {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; color: rgba(255,255,255,0.7);
      padding: 12px;
      text-align: center;
      line-height: 1.4;
    }
    /* Style-specific thumb treatments */
    .tpl-card[data-style="fresh"] .tpl-thumb { background: linear-gradient(135deg, #e0f7f4 0%, #b2dfdb 100%); }
    .tpl-card[data-style="retro"] .tpl-thumb { background: linear-gradient(135deg, #d4a574 0%, #8b6f47 100%); }
    .tpl-card[data-style="handdrawn"] .tpl-thumb { background: linear-gradient(135deg, #f5f0e8 0%, #d4c5a9 100%); }
    .tpl-card[data-style="bold"] .tpl-thumb { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); }
    .tpl-card[data-style="cute"] .tpl-thumb { background: linear-gradient(135deg, #fce4ec 0%, #f8bbd9 100%); }
    .tpl-card[data-style="minimal"] .tpl-thumb { background: linear-gradient(135deg, #f5f5f5 0%, #e0e0e0 100%); }

    /* Bold style: add strong border treatment */
    .tpl-card[data-style="bold"] .tpl-thumb { border: 3px solid #f59e0b; }

    /* Cute style: extra rounded corners */
    .tpl-card[data-style="cute"] .tpl-thumb { border-radius: 0; }

    .tpl-meta { padding: 10px 12px 12px; }
    .tpl-title { font-size: 13px;  margin-bottom: 4px; }
    .tpl-desc { font-size: 11px; color: var(--text-3); line-height: 1.4; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .tpl-chips { display: flex; gap: var(--space-0); flex-wrap: wrap; }
    .tpl-chip {
      font-size: 10px; padding: 2px 6px;
      border-radius: var(--radius-control);
      background: var(--surface-2); color: var(--text-3);
    }

    /* ─── Form Section ─── */
    .form-section {
      margin-top: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
    }
    .form-section.is-hidden { display: none; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
    @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr; } }

    .field { display: flex; flex-direction: column; gap: var(--space-1); }
    .field label { font-size: 12px; color: var(--text-2);  }
    .field input, .field textarea, .field select {
      background: var(--surface-2);
      border: 1px solid var(--border-2);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 14px;
      padding: 10px 12px;
      resize: none;
      outline: none;
      transition: border-color 0.15s;
    }
    .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); }
    .field textarea { height: 72px; }
    .field select { cursor: pointer; }
    .field-full { grid-column: 1 / -1; }
    .field-half-full { grid-column: 1 / -1; }

    .form-footer {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 20px; padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    .price-info { font-size: 13px; color: var(--text-2); }
    .price-info strong { color: var(--accent); font-size: 15px; margin-left: 4px; }
    .btn-submit {
      display: flex; align-items: center; gap: var(--space-2);
      font-size: 14px;
      color: #0a0a0c; background: var(--accent);
      border: none; border-radius: var(--radius);
      padding: 10px 24px; cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-submit:hover { background: var(--accent-2); }
    .btn-submit:active { transform: scale(0.97); }
    .btn-submit.is-loading { opacity: 0.7; cursor: not-allowed; }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(0,0,0,0.2);
      border-top-color: #0a0a0c;
      border-radius: var(--radius-pill);
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── Recent / History Grid ─── */
    .history-section { display: none; margin-top: 16px; }
    .history-section.is-visible { display: block; }
    .history-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--space-3);
    }
    @media (max-width: 1024px) { .history-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 375px) { .history-grid { grid-template-columns: 1fr; } }

    .hist-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .hist-img {
      aspect-ratio: 16/9;
      background: var(--surface-2);
      display: flex; align-items: center; justify-content: center;
      color: var(--text-3); font-size: 12px;
      position: relative;
    }
    .hist-img img { width: 100%; height: 100%; object-fit: cover; }
    .hist-status {
      position: absolute; top: 8px; right: 8px;
      font-size: 10px; padding: 3px 8px;
      border-radius: var(--radius-2xl);
      background: rgba(0,0,0,0.6); color: #fff;
    }
    .hist-status.done { background: rgba(34,197,94,0.8); }
    .hist-status.fail { background: rgba(239,68,68,0.8); }
    .hist-meta { padding: 10px 12px; }
    .hist-meta strong { font-size: 12px; display: block; margin-bottom: 2px; }
    .hist-meta span { font-size: 11px; color: var(--text-3); }
    .hist-actions { display: flex; gap: var(--space-1); padding: 0 12px 10px; }
    .hist-action {
      font-size: 11px; padding: 4px 10px;
      border-radius: var(--radius); border: 1px solid var(--border-2);
      background: none; color: var(--text-2); cursor: pointer;
      display: flex; align-items: center; gap: var(--space-0);
      transition: all 0.15s;
    }
    .hist-action:hover { color: var(--text); border-color: var(--text-3); }
    .hist-action.danger:hover { color: var(--danger); border-color: var(--danger); }

    .history-empty {
      padding: 64px;
      text-align: center;
      color: var(--text-3);
      border: 1px dashed var(--border);
      border-radius: var(--radius-lg);
      font-size: 14px;
    }

    /* ─── Tweaks Panel ─── */
    .tweaks-btn {
      position: fixed; bottom: 20px; right: 20px;
      width: 44px; height: 44px;
      border-radius: 50%;
      background: var(--surface-2); border: 1px solid var(--border-2);
      color: var(--text-2); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; transition: all 0.2s;
      z-index: 100;
    }
    .tweaks-btn:hover { background: var(--surface); color: var(--text); }
    .tweaks-panel {
      position: fixed; bottom: 72px; right: 20px;
      width: 280px;
      background: var(--surface);
      border: 1px solid var(--border-2);
      border-radius: var(--radius-lg);
      padding: 20px;
      z-index: 100;
      display: none;
      box-shadow: 0 16px 48px rgba(0,0,0,0.5);
    }
    .tweaks-panel.is-open { display: block; }
    .tweaks-title { font-size: 12px;  text-transform: uppercase; letter-spacing: 1px; color: var(--text-3); margin-bottom: 16px; }
    .tweak-item { margin-bottom: 16px; }
    .tweak-item label { font-size: 12px; color: var(--text-2); display: block; margin-bottom: 6px; }
    .tweak-item select, .tweak-item input[type="range"] { width: 100%; }
    .tweak-item select {
      background: var(--surface-2); border: 1px solid var(--border-2);
      border-radius: var(--radius); color: var(--text);
      padding: 6px 10px; cursor: pointer; font-size: 13px;
    }
    .tweak-item input[type="range"] {
      accent-color: var(--accent); cursor: pointer;
    }
    .tweaks-hint { font-size: 11px; color: var(--text-3); margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
  </style>
</head>

let selectedTemplate = null;
let activeType = "all";

function renderGrid(filter = "all") {
  const grid = document.getElementById("templateGrid");
  grid.innerHTML = "";
  const filtered = filter === "all" ? templates : templates.filter(t => t.contentType === filter);

  filtered.forEach(tpl => {
    const card = document.createElement("div");
    card.className = "tpl-card" + (selectedTemplate?.id === tpl.id ? " is-selected" : "");
    card.dataset.style = tpl.style;
    card.dataset.type = tpl.contentType;
    card.onclick = () => selectTemplate(tpl);

    card.innerHTML = `
      <div class="tpl-thumb" style="background:${tpl.thumbBg}">
        <div class="tpl-thumb-inner">${tpl.thumbLabel.replace('\n','<br>')}</div>
      </div>
      <div class="tpl-meta">
        <div class="tpl-title">${tpl.title}</div>
        <div class="tpl-desc">${tpl.desc}</div>
        <div class="tpl-chips">
          <span class="tpl-chip">${tpl.contentTypeLabel}</span>
          <span class="tpl-chip">${tpl.styleLabel}</span>
          <span class="tpl-chip">${tpl.ratioLabel}</span>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
}

function selectTemplate(tpl) {
  selectedTemplate = tpl;

  // Update canvas zone
  const preview = document.getElementById("canvasPreview");
  const previewInner = document.getElementById("canvasPreviewInner");
  const previewLabel = document.getElementById("canvasPreviewLabel");
  const canvasTitle = document.getElementById("canvasTitle");
  const canvasTags = document.getElementById("canvasTags");
  const canvasEmpty = document.getElementById("canvasEmpty");
  const canvasSelected = document.getElementById("canvasSelected");

  // Set preview background from template
  preview.style.background = tpl.thumbBg;
  previewInner.innerHTML = tpl.thumbLabel.replace('\n', '<br>');
  previewLabel.textContent = tpl.ratioLabel + " · " + tpl.contentTypeLabel;

  // Canvas aspect ratio
  preview.className = "canvas-preview";
  if (tpl.ratio === "9:16") preview.classList.add("thumb");
  else if (tpl.ratio === "1:1") preview.classList.add("square");
  else if (tpl.ratio === "3:4") preview.classList.add("thumb-vertical");

  canvasTitle.textContent = tpl.title;
  canvasTags.innerHTML = `
    <span class="tag">${tpl.contentTypeLabel}</span>
    <span class="tag layout">${tpl.styleLabel} · ${tpl.layoutLabel}</span>
    <span class="tag palette">${tpl.paletteLabel}</span>
    <span class="tag">${tpl.ratioLabel}</span>
  `;

  canvasEmpty.style.display = "none";
  canvasSelected.classList.add("is-visible");

  // Auto-fill form
  document.getElementById("formAspectRatio").value = tpl.ratio;

  // Update card selection states
  document.querySelectorAll(".tpl-card").forEach(c => {
    c.classList.toggle("is-selected", c.dataset.type === tpl.contentType && c.querySelector(".tpl-title").textContent === tpl.title);
  });
}

function clearTemplate() {
  selectedTemplate = null;
  document.getElementById("canvasEmpty").style.display = "flex";
  document.getElementById("canvasSelected").classList.remove("is-visible");
  document.querySelectorAll(".tpl-card").forEach(c => c.classList.remove("is-selected"));
}

function filterType(type) {
  activeType = type;
  document.querySelectorAll(".type-tab").forEach(t => t.classList.toggle("is-active", t.textContent === (type === "all" ? "全部" : type === "xiaohongshu-cover" ? "小红书封�? : type === "quote-poster" ? "金句海报" : type === "knowledge-card" ? "知识卡片" : type === "tutorial" ? "步骤教程�? : type === "product-card" ? "产品卖点�? : type === "comparison" ? "对比分析�? : "全部")));
  renderGrid(type);
}

function switchTab(tab) {

  document.getElementById("tab-recent").style.display = tab === "recent" ? "block" : "none";
  document.getElementById("tab-favorite").style.display = tab === "favorite" ? "block" : "none";
}
