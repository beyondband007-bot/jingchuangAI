<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f7ff"/>
      <stop offset="45%" stop-color="#f0ecff"/>
      <stop offset="100%" stop-color="#e8e4ff"/>
    </linearGradient>
    <linearGradient id="noteBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="noteHead" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="platform" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ede9fe" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="18" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.18"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="blurOrb" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bg)"/>

  <!-- Soft large orbs -->
  <circle cx="980" cy="160" r="220" fill="#ddd6fe" opacity="0.35" filter="url(#blurOrb)"/>
  <circle cx="180" cy="520" r="180" fill="#c7d2fe" opacity="0.25" filter="url(#blurOrb)"/>
  <circle cx="1050" cy="560" r="140" fill="#e0e7ff" opacity="0.4" filter="url(#blurOrb)"/>

  <!-- Wave lines on the left -->
  <g opacity="0.22" stroke="#a78bfa" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M60,260 Q160,220 260,260 T460,260"/>
    <path d="M40,310 Q140,270 240,310 T440,310"/>
    <path d="M80,360 Q180,320 280,360 T480,360"/>
    <path d="M120,410 Q220,370 320,410 T520,410"/>
  </g>

  <!-- Sound wave bars behind the platform -->
  <g transform="translate(760, 210)">
    <rect x="0" y="42" width="10" height="58" rx="5" fill="url(#bar)" opacity="0.35"/>
    <rect x="18" y="22" width="10" height="98" rx="5" fill="url(#bar)" opacity="0.45"/>
    <rect x="36" y="0" width="10" height="142" rx="5" fill="url(#bar)" opacity="0.55"/>
    <rect x="54" y="32" width="10" height="78" rx="5" fill="url(#bar)" opacity="0.4"/>
    <rect x="72" y="54" width="10" height="34" rx="5" fill="url(#bar)" opacity="0.3"/>
    <rect x="90" y="28" width="10" height="86" rx="5" fill="url(#bar)" opacity="0.45"/>
    <rect x="108" y="48" width="10" height="46" rx="5" fill="url(#bar)" opacity="0.32"/>
  </g>

  <!-- Platform rings -->
  <g transform="translate(820, 480)">
    <ellipse cx="0" cy="0" rx="240" ry="48" fill="#f5f3ff" opacity="0.6"/>
    <ellipse cx="0" cy="-6" rx="200" ry="40" fill="url(#platform)" filter="url(#softShadow)"/>
    <ellipse cx="0" cy="-6" rx="200" ry="40" fill="url(#ring)"/>
    <ellipse cx="0" cy="-6" rx="156" ry="31" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.35"/>
    <ellipse cx="0" cy="-6" rx="112" ry="22" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.25"/>
  </g>

  <!-- 3D Music Note -->
  <g transform="translate(820, 300)" filter="url(#softShadow)">
    <!-- Stem -->
    <rect x="38" y="-90" width="22" height="160" rx="11" fill="url(#noteBody)"/>
    <!-- Flag -->
    <path d="M60,-90 C60,-130 120,-125 120,-88 L120,-70 C120,-95 80,-98 60,-78 Z" fill="url(#noteBody)"/>
    <!-- Lower note head -->
    <ellipse cx="0" cy="58" rx="46" ry="34" fill="url(#noteHead)"/>
    <!-- Upper note head -->
    <ellipse cx="-10" cy="-18" rx="42" ry="31" fill="url(#noteBody)"/>
    <!-- Highlight -->
    <ellipse cx="-16" cy="-24" rx="16" ry="10" fill="#ffffff" opacity="0.35"/>
    <ellipse cx="-10" cy="52" rx="18" ry="10" fill="#ffffff" opacity="0.35"/>
  </g>

  <!-- Floating spheres -->
  <circle cx="680" cy="180" r="14" fill="#818cf8" opacity="0.55"/>
  <circle cx="1020" cy="260" r="10" fill="#60a5fa" opacity="0.5"/>
  <circle cx="720" cy="390" r="18" fill="#c084fc" opacity="0.35"/>
  <circle cx="1080" cy="420" r="12" fill="#a78bfa" opacity="0.45"/>

  <!-- Small sparkles -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="750" cy="150" r="3"/>
    <circle cx="980" cy="120" r="2.5"/>
    <circle cx="640" cy="280" r="2"/>
    <circle cx="1120" cy="340" r="2.5"/>
  </g>
</svg>