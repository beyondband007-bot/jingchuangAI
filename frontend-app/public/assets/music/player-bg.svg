<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbf9ff"/>
      <stop offset="50%" stop-color="#f5f2ff"/>
      <stop offset="100%" stop-color="#ede8ff"/>
    </linearGradient>
    <linearGradient id="noteBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a99af8"/>
      <stop offset="100%" stop-color="#7a6df0"/>
    </linearGradient>
    <linearGradient id="noteHead" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8ab4fa"/>
      <stop offset="100%" stop-color="#6aa4f9"/>
    </linearGradient>
    <linearGradient id="platform" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e8e4ff" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dx="0" dy="16" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.16"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="blurOrb" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Soft orbs -->
  <circle cx="650" cy="150" r="180" fill="#ddd6fe" opacity="0.35" filter="url(#blurOrb)"/>
  <circle cx="120" cy="480" r="140" fill="#c7d2fe" opacity="0.22" filter="url(#blurOrb)"/>

  <!-- Sound bars at top -->
  <g transform="translate(520, 60)" opacity="0.35">
    <rect x="0" y="30" width="8" height="40" rx="4" fill="#a99af8"/>
    <rect x="14" y="15" width="8" height="70" rx="4" fill="#9d8ff8"/>
    <rect x="28" y="0" width="8" height="100" rx="4" fill="#8b7df7"/>
    <rect x="42" y="20" width="8" height="60" rx="4" fill="#9d8ff8"/>
    <rect x="56" y="40" width="8" height="30" rx="4" fill="#a99af8"/>
    <rect x="70" y="18" width="8" height="65" rx="4" fill="#8b7df7"/>
    <rect x="84" y="35" width="8" height="35" rx="4" fill="#a99af8"/>
    <rect x="98" y="10" width="8" height="80" rx="4" fill="#9d8ff8"/>
    <rect x="112" y="28" width="8" height="45" rx="4" fill="#a99af8"/>
  </g>

  <!-- Wave lines -->
  <g opacity="0.12" stroke="#a99af8" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M40,320 Q160,280 280,320 T520,320"/>
    <path d="M20,360 Q140,320 260,360 T500,360"/>
    <path d="M60,400 Q180,360 300,400 T540,400"/>
  </g>

  <!-- Platform rings -->
  <g transform="translate(620, 520)" opacity="0.6">
    <ellipse cx="0" cy="0" rx="180" ry="36" fill="#f5f3ff"/>
    <ellipse cx="0" cy="-4" rx="150" ry="30" fill="url(#platform)" filter="url(#softShadow)"/>
    <ellipse cx="0" cy="-4" rx="150" ry="30" fill="none" stroke="#c4b5fd" stroke-width="1.5" opacity="0.4"/>
    <ellipse cx="0" cy="-4" rx="110" ry="22" fill="none" stroke="#c4b5fd" stroke-width="1.5" opacity="0.25"/>
  </g>

  <!-- 3D Note -->
  <g transform="translate(620, 400)" filter="url(#softShadow)">
    <rect x="28" y="-70" width="18" height="130" rx="9" fill="url(#noteBody)"/>
    <path d="M46,-70 C46,-100 95,-95 95,-68 L95,-55 C95,-75 60,-78 46,-60 Z" fill="url(#noteBody)"/>
    <ellipse cx="-6" cy="50" rx="38" ry="28" fill="url(#noteHead)"/>
    <ellipse cx="-12" cy="-8" rx="34" ry="25" fill="url(#noteBody)"/>
    <ellipse cx="-16" cy="-14" rx="14" ry="8" fill="#ffffff" opacity="0.35"/>
    <ellipse cx="-10" cy="44" rx="16" ry="8" fill="#ffffff" opacity="0.35"/>
  </g>

  <!-- Floating spheres -->
  <circle cx="500" cy="200" r="10" fill="#818cf8" opacity="0.4"/>
  <circle cx="720" cy="300" r="8" fill="#60a5fa" opacity="0.35"/>
  <circle cx="450" cy="450" r="12" fill="#c084fc" opacity="0.25"/>

  <!-- Subtle note silhouette left -->
  <g transform="translate(80, 180) rotate(-15)" opacity="0.08">
    <rect x="0" y="-40" width="14" height="90" rx="7" fill="#8b7df7"/>
    <ellipse cx="-12" cy="42" rx="26" ry="18" fill="#8b7df7"/>
    <path d="M14,-40 C14,-62 50,-58 50,-38 L50,-28 C50,-44 22,-46 14,-32 Z" fill="#8b7df7"/>
  </g>
</svg>