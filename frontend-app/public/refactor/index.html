<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facemini.com</title>
  <style>
    @font-face { font-family: "Zona Pro"; src: url("fonts/ZonaPro-SemiBold.woff2") format("woff2"); font-weight: 400 700; font-style: normal; font-display: swap; }
    :root {
      --background: 0 0% 2.2%; --foreground: 0 0% 98%; --card: 0 0% 7%; --card-foreground: 0 0% 98%;
      --popover: 0 0% 7%; --popover-foreground: 0 0% 98%; --primary: 0 0% 98%; --primary-foreground: 0 0% 9%;
      --secondary: 0 0% 14.9%; --secondary-foreground: 0 0% 98%; --muted: 0 0% 15%; --muted-foreground: 218 11% 65%;
      --accent: 0 0% 14.9%; --accent-foreground: 0 0% 98%; --destructive: 0 62.8% 30.6%; --destructive-foreground: 0 0% 98%;
      --border: 0 0% 15%; --input: 0 0% 15%; --ring: 0 0% 83.1%;
      --sidebar-background: 0 0% 3.5%; --sidebar-foreground: 220 9% 88%; --sidebar-primary: 263 70% 58%;
      --sidebar-primary-foreground: 0 0% 100%; --sidebar-accent: 0 0% 12%; --sidebar-accent-foreground: 220 9% 88%;
      --sidebar-border: 0 0% 15%; --sidebar-ring: 263 70% 58%;
      --ref-border: #262626; --ref-subtle: #888888; --ref-nav: #d1d5db; --ref-purple: #a855f7;
    }
    * { border-color: hsl(var(--border)); box-sizing: border-box; }
    html,
    body {
      scrollbar-width: thin;
      scrollbar-color: #888888 rgba(255, 255, 255, 0.04);
    }
    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }
    html::-webkit-scrollbar-track,
    body::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.035);
      border-radius: 999px;
    }
    html::-webkit-scrollbar-thumb,
    body::-webkit-scrollbar-thumb {
      background: #888888;
      border: 2px solid rgba(5, 5, 5, 0.78);
      border-radius: 999px;
    }
    html::-webkit-scrollbar-thumb:hover,
    body::-webkit-scrollbar-thumb:hover {
      background: #9a9a9a;
    }
    body { background-color: hsl(var(--background)); color: hsl(var(--foreground)); font-family: 'Zona Pro', system-ui, sans-serif; -webkit-font-smoothing: antialiased; margin: 0; }
    .app-shell { display: flex; min-height: 100vh; }
    .sidebar-desktop { position: fixed; top: 0; left: 0; bottom: 0; width: 256px; background: hsl(var(--sidebar-background)); border-right: 1px solid var(--ref-border); display: flex; flex-direction: column; z-index: 30; overflow: hidden; }
    .sidebar-inner { display: flex; flex-direction: column; height: 100%; }
    .sidebar-brand { padding: 16px; border-bottom: 1px solid var(--ref-border); }
    /* 与 out/index 导出一致：大号 Zona + 五色横向渐变 + 背景位移动画 */
    .animated-gradient-text {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: flex-start;
      max-width: fit-content;
      border-radius: 1.25rem;
      font-family: 'Zona Pro', system-ui, sans-serif;
      font-weight: 600;
      overflow: hidden;
    }
    .brand-logo-text {
      display: inline-block;
      position: relative;
      z-index: 2;
      font-size: clamp(20px, 2.4vw, 25px);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
      background-image: linear-gradient(to right, #5a2cfc, #ad6cfc, #d8deff, #162089, #5a2cfc);
      background-size: 300% 100%;
      background-repeat: repeat;
      background-position: 0% 50%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      animation: brandGradientShift 5s ease-in-out infinite;
    }
    @keyframes brandGradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .brand-logo-text { animation: none; }
    }
    .sidebar-search { padding: 12px 16px; }
    .search-wrap { position: relative; }
    .search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--ref-subtle); }
    .search-input { width: 100%; padding: 9px 12px 9px 36px; background: #262626; border: 1px solid var(--ref-border); border-radius: 9999px; color: hsl(var(--sidebar-foreground)); font-size: 14px; font-family: inherit; outline: none; transition: border-color 0.15s; }
    .search-input::placeholder { color: var(--ref-subtle); }
    .search-input:focus { border-color: var(--ref-purple); }
    .sidebar-nav { flex: 1; overflow-y: auto; padding: 8px 12px; scrollbar-width: none; }
    .sidebar-nav::-webkit-scrollbar { display: none; }
    .nav-section { margin-bottom: 4px; }
    .nav-item { display: flex; align-items: center; width: 100%; padding: 9px 12px; color: var(--ref-nav); background: transparent; border: none; border-radius: 12px; cursor: pointer; font-size: 14px; font-weight: 500; font-family: inherit; text-align: left; transition: background 0.15s ease, color 0.15s ease; gap: 10px; text-decoration: none; box-sizing: border-box; }
    .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.9; }
    .nav-item:hover { background: hsl(var(--sidebar-accent)); color: hsl(var(--sidebar-foreground)); }
    .nav-item.is-active { background: hsl(var(--sidebar-accent)); color: hsl(var(--sidebar-primary)); }
    .nav-item.is-active svg { opacity: 1; }
    .nav-item .chevron { margin-left: auto; transition: transform 0.2s; }
    .nav-item.is-open .chevron { transform: rotate(180deg); }
    .nav-children { padding-left: 36px; overflow: hidden; max-height: 0; transition: max-height 0.3s ease; }
    .nav-section--collapsible .nav-children.is-open { max-height: 560px; }
    .nav-children.nav-children--static {
      max-height: none !important;
      overflow: visible;
      padding-left: 10px;
      padding-bottom: 2px;
    }
    .nav-group-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px 6px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: rgba(136, 136, 136, 0.95);
      text-transform: uppercase;
      user-select: none;
    }
    .nav-group-head svg { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.72; color: var(--ref-nav); }
    .nav-section--collapsible .nav-children { padding-left: 36px; }
    .nav-child-item { display: flex; align-items: center; gap: 10px; padding: 7px 12px 7px 10px; color: var(--ref-subtle); font-size: 13px; border-radius: 8px; cursor: pointer; transition: background 0.15s, color 0.15s; text-decoration: none; }
    .nav-child-ic { display: grid; place-items: center; width: 20px; height: 20px; flex-shrink: 0; color: var(--ref-subtle); opacity: 0.92; }
    .nav-child-ic svg { width: 16px; height: 16px; }
    .nav-child-item:hover .nav-child-ic,
    .nav-child-item.is-active .nav-child-ic { color: inherit; opacity: 1; }
    .nav-child-txt { flex: 1; min-width: 0; }
    .nav-child-item:hover { background: hsl(var(--sidebar-accent)); color: hsl(var(--sidebar-foreground)); }
    .nav-child-item.is-active { color: hsl(var(--sidebar-primary)); background: hsl(var(--sidebar-primary) / 0.1); }
    .sidebar-bottom { padding: 12px; border-top: 1px solid var(--ref-border); flex-shrink: 0; }
    .sidebar-login { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 10px; background: hsl(var(--sidebar-background)); color: var(--ref-nav); border: 1px solid var(--ref-border); border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 600; font-family: inherit; transition: background 0.15s; }
    .sidebar-login:hover { background: hsl(var(--sidebar-accent)); }
    .sidebar-login svg { width: 16px; height: 16px; }
    .main-content { flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
    .topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 16px; padding: 0 32px; height: 64px; background: hsl(var(--background)); border-bottom: 1px solid var(--ref-border); backdrop-filter: blur(12px); }
    .topbar-search { position: relative; flex: 1; max-width: 480px; }
    .topbar-search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--ref-subtle); }
    .topbar-search input { width: 100%; padding: 9px 14px 9px 40px; background: #262626; border: 1px solid var(--ref-border); border-radius: 9999px; color: var(--ref-nav); font-size: 14px; font-family: inherit; outline: none; transition: border-color 0.15s; }
    .topbar-search input::placeholder { color: var(--ref-subtle); }
    .topbar-search input:focus { border-color: var(--ref-purple); }
    .topbar-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    .topbar-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; background: hsl(var(--muted)); border: 1px solid hsl(var(--border)); border-radius: 9999px; color: hsl(var(--foreground)); font-size: 13px; font-family: inherit; cursor: pointer; transition: background 0.15s; }
    .topbar-btn:hover { background: hsl(var(--sidebar-accent)); }
    .topbar-btn svg { width: 15px; height: 15px; }
    .topbar-btn.primary { background: hsl(var(--sidebar-primary)); border-color: hsl(var(--sidebar-primary)); color: hsl(var(--sidebar-primary-foreground)); }
    .topbar-btn.primary:hover { opacity: 0.9; }
    .page-scroll { flex: 1; overflow-y: auto; padding: 28px 32px 60px; scrollbar-width: thin; scrollbar-color: #888888 rgba(255, 255, 255, 0.04); }
    .page-scroll::-webkit-scrollbar { width: 10px; height: 10px; }
    .page-scroll::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.035); border-radius: 999px; }
    .page-scroll::-webkit-scrollbar-thumb { background: #888888; border: 2px solid rgba(5, 5, 5, 0.78); border-radius: 999px; }
    .page-scroll::-webkit-scrollbar-thumb:hover { background: #9a9a9a; }
    .hero-section {
      --hero-carousel-height: 304px;
      --hero-card-width: min(36.5%, 560px);
      --hero-card-height: 236px;
      --hero-card-radius: 18px;
      --hero-side-offset: min(50.5%, 840px);
      --hero-side-scale: 0.972;
      --hero-side-opacity: 0.74;
      --hero-stage-padding: 34px;
      --hero-dot-active: 20px;
      --hero-dot-idle: 10px;
      position: relative;
      margin-bottom: 32px;
      width: 100%;
      padding: 0 12px;
      box-sizing: border-box;
      color: #fff;
      background: transparent;
    }
    .hero-carousel-shell {
      position: relative;
      width: 100%;
      margin: 0 auto;
      max-width: 100%;
      padding: 10px 0 34px;
    }
    .hero-carousel-stage {
      position: relative;
      height: var(--hero-carousel-height);
      overflow: hidden;
      isolation: isolate;
      perspective: 1800px;
      perspective-origin: center center;
    }
    .hero-carousel-card {
      --hero-side-dim: 0;
      position: absolute;
      left: 50%;
      top: var(--hero-stage-padding);
      width: var(--hero-card-width);
      height: var(--hero-card-height);
      border: 0;
      border-radius: var(--hero-card-radius);
      overflow: hidden;
      background: #232323;
      padding: 0;
      color: inherit;
      text-align: left;
      cursor: pointer;
      transform-origin: center center;
      transform-style: preserve-3d;
      backface-visibility: hidden;
      transition:
        transform 460ms cubic-bezier(0.22, 1, 0.36, 1),
        opacity 300ms ease,
        filter 360ms ease,
        box-shadow 360ms ease;
      box-shadow: none;
    }
    .hero-carousel-card.is-hidden {
      opacity: 0;
      pointer-events: none;
      transform: translate3d(-50%, 0, 0) rotateY(0deg) scale(0.92);
    }
    .hero-carousel-card.is-center {
      z-index: 3;
      transform: translate3d(-50%, 0, 0) rotateY(0deg) scale(1.018);
      opacity: 1;
      filter: none;
      box-shadow: none;
    }
    .hero-carousel-card.is-prev,
    .hero-carousel-card.is-next {
      z-index: 2;
      opacity: var(--hero-side-opacity);
      filter: brightness(0.7) saturate(0.92);
    }
    .hero-carousel-card.is-prev {
      transform: translate3d(calc(-50% - var(--hero-side-offset)), 2px, 0) scale(var(--hero-side-scale));
    }
    .hero-carousel-card.is-next {
      transform: translate3d(calc(-50% + var(--hero-side-offset)), 2px, 0) scale(var(--hero-side-scale));
    }
    .hero-carousel-media,
    .hero-carousel-media img {
      width: 100%;
      height: 100%;
      display: block;
    }
    .hero-carousel-media {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #353535 0%, #1d1d1d 100%);
    }
    .hero-carousel-media img {
      object-fit: cover;
    }
    .hero-carousel-scrim {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(0deg, rgba(0, 0, 0, var(--hero-side-dim)) 0%, rgba(0, 0, 0, var(--hero-side-dim)) 100%),
        linear-gradient(180deg, rgba(0, 0, 0, 0.04) 0%, rgba(0, 0, 0, 0.08) 38%, rgba(0, 0, 0, 0.32) 100%),
        linear-gradient(90deg, rgba(0, 0, 0, 0.44) 0%, rgba(0, 0, 0, 0.14) 42%, rgba(0, 0, 0, 0.06) 100%);
    }
    .hero-carousel-card[data-accent="red"] .hero-carousel-scrim {
      background:
        linear-gradient(0deg, rgba(0, 0, 0, var(--hero-side-dim)) 0%, rgba(0, 0, 0, var(--hero-side-dim)) 100%),
        linear-gradient(180deg, rgba(0, 0, 0, 0.02) 0%, rgba(0, 0, 0, 0.06) 42%, rgba(0, 0, 0, 0.34) 100%),
        linear-gradient(90deg, rgba(214, 10, 10, 0.92) 0%, rgba(214, 10, 10, 0.16) 14%, rgba(0, 0, 0, 0.08) 42%, rgba(0, 0, 0, 0.04) 100%);
    }
    .hero-carousel-copy {
      position: absolute;
      left: 30px;
      right: 30px;
      bottom: 24px;
      z-index: 2;
    }
    .hero-carousel-copy[data-align="center"] {
      left: 50%;
      right: auto;
      bottom: 34px;
      width: min(74%, 320px);
      text-align: center;
      transform: translateX(-50%);
    }
    .hero-carousel-copy.is-empty {
      display: none;
    }
    .hero-carousel-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 20px;
      margin-bottom: 10px;
      color: rgba(255, 255, 255, 0.78);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .hero-carousel-card[data-align="center"] .hero-carousel-eyebrow {
      justify-content: center;
    }
    .hero-carousel-copy h2 {
      margin: 0;
      color: #fff;
      font-size: clamp(15px, 1.9vw, 18px);
      font-weight: 700;
      line-height: 1.16;
      letter-spacing: -0.02em;
      text-shadow: 0 6px 18px rgba(0, 0, 0, 0.32);
    }
    .hero-carousel-copy p {
      margin: 8px 0 0;
      color: rgba(255, 255, 255, 0.78);
      font-size: 11px;
      line-height: 1.45;
    }
    .hero-carousel-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 18px;
      padding: 0 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: rgba(255, 255, 255, 0.92);
      font-size: 10px;
      line-height: 1;
    }
    .hero-carousel-arrow {
      position: absolute;
      top: 50%;
      z-index: 4;
      width: 30px;
      height: 30px;
      margin-top: -19px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 8px;
      color: rgba(255, 255, 255, 0.9);
      background: rgba(64, 64, 64, 0.88);
      cursor: pointer;
      transition: background 180ms ease, opacity 180ms ease;
    }
    .hero-carousel-arrow:hover {
      background: rgba(86, 86, 86, 0.96);
    }
    .hero-carousel-arrow.prev { left: 14px; }
    .hero-carousel-arrow.next { right: 14px; }
    .hero-carousel-arrow svg {
      width: 14px;
      height: 14px;
      display: block;
    }
    .hero-carousel-arrow path {
      stroke: currentColor;
    }
    .hero-carousel-dots {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 2px;
    }
    .hero-carousel-dot {
      width: var(--hero-dot-idle);
      height: 4px;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.36);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      cursor: pointer;
      transition: width 220ms ease, background 220ms ease, opacity 220ms ease;
      opacity: 0.84;
    }
    .hero-carousel-dot.is-active {
      width: var(--hero-dot-active);
      background: rgba(205, 205, 205, 0.98);
      box-shadow: none;
      opacity: 1;
    }
    @media (max-width: 1280px) {
      .hero-section {
        --hero-card-width: min(40%, 500px);
        --hero-side-offset: min(51%, 640px);
      }
    }
    @media (max-width: 960px) {
      .hero-section {
        --hero-carousel-height: 280px;
        --hero-card-width: min(54%, 436px);
        --hero-card-height: 210px;
        --hero-side-offset: min(50%, 408px);
      }
      .hero-carousel-arrow.prev { left: 10px; }
      .hero-carousel-arrow.next { right: 10px; }
    }
    @media (max-width: 640px) {
      .hero-section {
        --hero-carousel-height: 232px;
        --hero-card-width: min(62%, 320px);
        --hero-card-height: 176px;
        --hero-side-offset: min(48%, 220px);
        padding: 0 8px;
      }
      .hero-carousel-arrow {
        width: 28px;
        height: 28px;
        margin-top: -18px;
      }
    }
    .hero-section {
      margin-bottom: 32px;
      padding: 0 clamp(12px, 2vw, 28px);
      background: transparent;
    }
    .hero-section.is-temporarily-hidden {
      display: none;
    }
    .hero-carousel-shell {
      width: min(100%, 1400px);
      margin: 0 auto;
      padding: 0;
    }
    .hero-carousel-layout {
      display: grid;
      grid-template-columns: 58fr 37fr 37fr;
      gap: 16px;
      align-items: stretch;
    }
    .hero-promo-card {
      position: relative;
      display: block;
      min-width: 0;
      aspect-ratio: 591 / 280;
      overflow: hidden;
      padding: 0;
      border: 0;
      border-radius: 8px;
      background: #141414;
      color: inherit;
      cursor: pointer;
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.28);
    }
    .hero-promo-card.is-slider {
      aspect-ratio: 927 / 280;
    }
    .hero-promo-card img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .hero-promo-card.is-slider img {
      opacity: 0;
      transform: scale(1.012);
      transition: opacity 520ms ease, transform 680ms ease;
    }
    .hero-promo-card.is-slider img.is-active {
      opacity: 1;
      transform: scale(1);
    }
    .hero-carousel-dots {
      position: absolute;
      left: 50%;
      bottom: 8px;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      margin: 0;
      transform: translateX(-50%);
    }
    .hero-carousel-dot {
      width: 16px;
      height: 3px;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.42);
      cursor: pointer;
      opacity: 0.9;
      transition: width 220ms ease, background 220ms ease;
    }
    .hero-carousel-dot.is-active {
      width: 24px;
      background: rgba(255, 255, 255, 0.96);
    }
    @media (max-width: 1180px) {
      .hero-carousel-layout {
        gap: 12px;
      }
    }
    @media (max-width: 760px) {
      .hero-carousel-layout {
        grid-template-columns: 1fr;
      }
    }
    .arc-wheel-zone { width: min(100%, 1680px); max-width: calc(88vw - 32px); margin-left: auto; margin-right: auto; margin-bottom: 36px; position: relative; }
    .arc-wheel-zone.home-top-arc {
      margin-top: 0;
      margin-bottom: 34px;
    }
    .home-top-arc .module-arc-stage {
      height: min(480px, 48vw);
      max-height: 560px;
    }
    .home-top-arc .arc-card-shell {
      bottom: 80px;
      transform-origin: 50% 100%;
    }
    @media (max-width: 540px) {
      .home-top-arc .module-arc-stage {
        height: min(520px, 94vw);
      }
      .home-top-arc .arc-card-shell {
        bottom: 98px;
      }
    }
    .feature-carousel-wrap.module-arc { position: relative; }
    .module-arc { position: relative; margin-bottom: 8px; }
    .module-arc-stage { position: relative; height: min(600px, 90vw); max-height: 700px; margin: 0 auto; overflow: hidden; border-radius: 20px; touch-action: pan-y; background: hsl(var(--background)); isolation: isolate; }
    /* 底部渐隐，与下方反光层配合 */
    .module-arc-stage::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 52%; pointer-events: none; z-index: 1; border-radius: inherit; background: linear-gradient(to top, hsl(var(--background)) 0%, hsl(var(--background) / 0.55) 32%, hsl(var(--background) / 0.12) 68%, transparent 100%); }
    /* 地面反光：宽椭圆 + 轻模糊，模拟参考图底部光斑 */

(function () {
  var stage = document.getElementById("homeTopArcStage");
  var pivot = document.getElementById("homeTopArcPivot");
  var prev = document.getElementById("homeTopArcPrev");
  var next = document.getElementById("homeTopArcNext");
  if (!stage || !pivot || !prev || !next) return;

  var cards = [
    { title: "图片生成", desc: "一句话生成高质量图片", image: "cases/thumb-img-gen.jpg", tint: "#a78bfa" },
    { title: "视频生成", desc: "快速创作镜头与分镜", image: "cases/gallery-3.jpg", tint: "#60a5fa" },
    { title: "数字人", desc: "形象、声音、文案全流程驱动", image: "cases/thumb-digital-human.jpg", tint: "#22d3ee" },
    { title: "动作迁移", desc: "参考动作驱动角色表演", image: "cases/hot-3-motion.jpg", tint: "#f472b6" },
    { title: "AI 音乐", desc: "旋律与氛围快速生成", image: "cases/hot-2-music.jpg", tint: "#fb923c" },
    { title: "智能抠图", desc: "主体识别与背景分离", image: "cases/gallery-6.jpg", tint: "#4ade80" },
    { title: "画质提升", desc: "细节增强与高清修复", image: "cases/gallery-10.jpg", tint: "#facc15" }
  ];
  var activeIndex = 0;
  var timer = null;
  var hover = false;
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function signedDistance(index, current, total) {
    var distance = index - current;
    if (distance > total / 2) distance -= total;
    if (distance < -total / 2) distance += total;
    return distance;
  }

  function render() {
    pivot.innerHTML = cards.map(function (card, index) {
      return '' +
        '<div class="arc-card-shell" data-index="' + index + '">' +
          '<button class="feature-card arc-card arc-card--visual" type="button" style="--arc-tint:' + card.tint + '">' +
            '<span class="arc-card-art"><img src="' + card.image + '" alt="' + card.title + '" loading="' + (index < 3 ? "eager" : "lazy") + '" decoding="async"></span>' +
            '<span class="feature-card-name">' + card.title + '</span>' +
            '<span class="feature-card-desc">' + card.desc + '</span>' +
          '</button>' +
        '</div>';
    }).join("");
    sync();
  }

  function sync() {
    var shells = Array.from(pivot.querySelectorAll(".arc-card-shell"));
    var stageWidth = stage.clientWidth || 1200;
    var isMobile = window.innerWidth <= 540;
    var spread = Math.min(isMobile ? 82 : 138, stageWidth / (isMobile ? 5.8 : 8.2));
    var maxVisible = isMobile ? 2 : 3;
    shells.forEach(function (shell, index) {
      var distance = signedDistance(index, activeIndex, cards.length);
      var absDistance = Math.abs(distance);
      var card = shell.querySelector(".feature-card");
      var visible = absDistance <= maxVisible;
      var x = distance * spread;
      var rotate = distance * (isMobile ? 12 : 14);
      var scale = Math.max(0.68, 1 - absDistance * 0.075);
      var y = -(absDistance * (isMobile ? 24 : 38));
      if (absDistance === 0) y = -22;
      if (absDistance === 1) y -= isMobile ? 8 : 18;
      if (absDistance >= 2) y -= isMobile ? 18 : 42;
      shell.style.opacity = visible ? "1" : "0";
      shell.style.pointerEvents = visible ? "auto" : "none";
      shell.style.zIndex = String(40 - absDistance);
      shell.style.transform = "translate3d(calc(-50% + " + x + "px), " + y + "px, 0) rotate(" + rotate + "deg) scale(" + scale + ")";
      if (card) card.classList.toggle("is-center", distance === 0);
    });
  }

  function goTo(index) {
    activeIndex = (index + cards.length) % cards.length;
    sync();
  }

  function startAuto() {
    if (reduceMotion) return;
    window.clearInterval(timer);
    timer = window.setInterval(function () {
      if (!hover) goTo(activeIndex + 1);
    }, 3600);
  }

  prev.addEventListener("click", function () { goTo(activeIndex - 1); startAuto(); });
  next.addEventListener("click", function () { goTo(activeIndex + 1); startAuto(); });
  pivot.addEventListener("click", function (event) {
    var shell = event.target.closest(".arc-card-shell");
    if (!shell) return;
    goTo(Number(shell.dataset.index || 0));
    startAuto();
  });
  stage.addEventListener("mouseenter", function () { hover = true; });
  stage.addEventListener("mouseleave", function () { hover = false; });
  window.addEventListener("resize", sync);

  render();
  startAuto();
})();
(function () {

  ];
  var activeIndex = 0;
  var hover = false;
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var timer = null;

  slides.forEach(function (slide, index) {
    var image = document.createElement("img");
    image.src = slide.image;
    image.alt = slide.alt;
    image.decoding = "async";
    image.loading = index === 0 ? "eager" : "lazy";
    if (index === 0) image.className = "is-active";
    stage.insertBefore(image, dots);
  });
  dots.innerHTML = slides.map(function (_, index) {
    return '<button class="hero-carousel-dot' + (index === 0 ? ' is-active' : '') + '" type="button" data-index="' + index + '" aria-label="切换到第 ' + (index + 1) + ' 张"></button>';
  }).join("");

  function sync(index) {
    activeIndex = (index + slides.length) % slides.length;
    Array.from(stage.querySelectorAll("img")).forEach(function (image, imageIndex) {
      image.classList.toggle("is-active", imageIndex === activeIndex);
    });
    Array.from(dots.querySelectorAll(".hero-carousel-dot")).forEach(function (dot, dotIndex) {
      dot.classList.toggle("is-active", dotIndex === activeIndex);
    });
  }

  function startAuto() {
    if (reduceMotion) return;
    window.clearInterval(timer);
    timer = window.setInterval(function () {
      if (!hover) sync(activeIndex + 1);
    }, 4200);
  }

  dots.addEventListener("click", function (event) {
    var dot = event.target.closest(".hero-carousel-dot");
    if (!dot) return;
    sync(Number(dot.dataset.index || 0));
    startAuto();
  });
  stage.addEventListener("mouseenter", function () { hover = true; });
  stage.addEventListener("mouseleave", function () { hover = false; });
  startAuto();
})();

    },
  ];
  var slides = baseSlides;

  var activeIndex = 0;

  function signedDistance(index, current, total) {

  function render() {

    }).join("");

    sync();
  }

  function sync() {
    var cards = Array.from(stage.querySelectorAll(".hero-carousel-card"));
    var dotNodes = Array.from(dots.querySelectorAll(".hero-carousel-dot"));
    var stageWidth = stage.clientWidth || 1200;
    var isMobile = window.innerWidth <= 640;
    var isTablet = window.innerWidth <= 960;
    var maxVisible = isMobile ? 3 : 5;
    var levels = Math.max(1, Math.floor(maxVisible / 2));
    var sampleCard = cards[0];
    var cardWidth = sampleCard ? sampleCard.offsetWidth || stageWidth * 0.328 : stageWidth * 0.328;
    var edgeInset = isMobile ? 0 : (isTablet ? 10 : 0);
    var levelScales = isTablet ? [1, 0.95, 0.84] : [1, 0.972, 0.86, 0.78];
    var levelRotates = isTablet ? [0, 18, 28] : [0, 18, 28, 34];
    function projectedWidth(level) {
      var scale = levelScales[level] || levelScales[levelScales.length - 1];
      var rotate = (levelRotates[level] || 0) * Math.PI / 180;
      return cardWidth * scale * Math.max(0.72, Math.cos(rotate));
    }
    var outerHalf = projectedWidth(levels) / 2;
    var maxCenterOffset = Math.max(0, stageWidth / 2 - outerHalf - edgeInset);
    var offsetRatios = isMobile ? [0, 0.82] : (isTablet ? [0, 0.58, 1] : [0, 0.52, 1]);
    cards.forEach(function (card, index) {
      var distance = signedDistance(index, activeIndex, slides.length);
      var absDistance = Math.abs(distance);
      var visible = absDistance <= Math.floor(maxVisible / 2);
      var x = 0;
      var y = 0;
      var scale = 1;
      var opacity = 1;
      var brightness = 1;
      var zIndex = 30;

      card.classList.remove("is-center", "is-prev", "is-next", "is-hidden");

      if (!visible) {
        card.classList.add("is-hidden");
        card.style.transform = "translate3d(-50%, 0, 0) rotateY(0deg) scale(0.92)";
        card.style.opacity = "0";
        card.style.filter = "none";
        card.style.setProperty("--hero-side-dim", "0.58");
        card.style.zIndex = "0";
      } else if (distance === 0) {
        card.classList.add("is-center");
        card.style.transform = "translate3d(-50%, 0, 0) rotateY(0deg) scale(1.018)";
        card.style.opacity = "1";
        card.style.filter = "none";
        card.style.setProperty("--hero-side-dim", "0");
        card.style.zIndex = "30";
      } else {
        var rotateY = 0;
        var dimAlpha = 0;
        if (absDistance === 1) {
          x = maxCenterOffset * offsetRatios[1] * (distance < 0 ? -1 : 1);
          y = 2;
          scale = isTablet ? 0.95 : 0.972;
          opacity = 1;
          brightness = 1;
          dimAlpha = 0.24;
          rotateY = distance < 0 ? 18 : -18;
        } else if (absDistance === 2) {
          x = maxCenterOffset * offsetRatios[2] * (distance < 0 ? -1 : 1);
          y = 6;
          scale = isTablet ? 0.84 : 0.86;
          opacity = 1;
          brightness = 1;
          dimAlpha = 0.4;
          rotateY = distance < 0 ? 28 : -28;
        } else {
          x = maxCenterOffset * offsetRatios[3] * (distance < 0 ? -1 : 1);
          y = 12;
          scale = isTablet ? 0.76 : 0.78;
          opacity = 1;
          brightness = 1;
          dimAlpha = 0.54;
          rotateY = distance < 0 ? 34 : -34;
        }
        if (distance < 0) card.classList.add("is-prev");
        else card.classList.add("is-next");
        card.style.transform = "translate3d(calc(-50% + " + x + "px), " + y + "px, 0) rotateY(" + rotateY + "deg) scale(" + scale + ")";
        card.style.opacity = String(opacity);
        card.style.filter = "none";
        card.style.setProperty("--hero-side-dim", String(dimAlpha));
        zIndex = 30 - absDistance;
        card.style.zIndex = String(zIndex);
      }
    });
    dotNodes.forEach(function (dot, index) {
      dot.classList.toggle("is-active", index === activeIndex);
    });
  }

  function goTo(index) {
    activeIndex = (index + slides.length) % slides.length;
    sync();
  }

  function nextSlide() {
    goTo(activeIndex + 1);
  }

  function prevSlide() {
    goTo(activeIndex - 1);
  }

  function stopAuto() {
    if (!timer) return;
    window.clearInterval(timer);
    timer = null;
  }

  function startAuto() {
    if (reduceMotion) return;
    stopAuto();
    timer = window.setInterval(function () {
      if (!hover) nextSlide();
    }, 4000);
  }

  stage.addEventListener("click", function (event) {
    var card = event.target.closest(".hero-carousel-card");
    if (!card) return;
    var index = Number(card.getAttribute("data-index"));
    if (index === activeIndex) {
      console.log("hero slide click", slides[index]);
      return;
    }
    goTo(index);
  });

  dots.addEventListener("click", function (event) {
    var dot = event.target.closest(".hero-carousel-dot");
    if (!dot) return;
    goTo(Number(dot.getAttribute("data-index")));
  });

  prev.addEventListener("click", prevSlide);
  next.addEventListener("click", nextSlide);

  root.addEventListener("mouseenter", function () {
    hover = true;
  });
  root.addEventListener("mouseleave", function () {
    hover = false;
  });

  window.addEventListener("resize", sync);

  render();
  startAuto();
})();
