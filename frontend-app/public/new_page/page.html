<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#00000b">
  <title>Facemini</title>
  <style>
    html,
    body {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #00000b;
      color: #fff;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    *,
    *::before,
    *::after {
      box-sizing: inherit;
    }

    body {
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #brand-prelude {
      position: fixed;
      inset: 0;
      z-index: 6;
      display: flex;
      align-items: center;
      justify-content: center;
      isolation: isolate;
      background:
        radial-gradient(circle at center, #0c0e22 0%, #090b19 34%, #030511 68%, #00000b 100%);
      cursor: pointer;
      pointer-events: auto;
      opacity: 1;
      transition: opacity 1100ms cubic-bezier(0.22, 1, 0.36, 1), visibility 0s linear 1100ms;
      overflow: hidden;
    }

    #brand-prelude.is-hidden {
      opacity: 0;
      visibility: hidden;
    }

    #brand-prelude-burst {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      opacity: 0;
      animation: brand-prelude-burst-fade-in 500ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    #brand-prelude-burst::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at center, rgba(12, 14, 34, 0.12) 0%, rgba(4, 4, 16, 0.22) 58%, rgba(0, 0, 11, 0.3) 100%);
      pointer-events: none;
    }

    #brand-prelude-burst canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    @keyframes brand-prelude-burst-fade-in {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    .brand-prelude-text {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      max-width: calc(100vw - 72px);
      height: auto;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 96px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: 0;
      white-space: nowrap;
      transform: scale(1);
      opacity: 0;
      will-change: transform, opacity;
      transition: transform 1250ms cubic-bezier(0.16, 1, 0.3, 1), opacity 900ms cubic-bezier(0.32, 0, 0.08, 1);
    }

    .brand-prelude-text.is-visible {
      opacity: 1;
    }

    .brand-prelude-text.is-clicked {
      animation: brand-prelude-click-out 1120ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
      pointer-events: none;
    }

    .brand-prelude-char {
      display: inline-block;
      position: relative;
      opacity: 0;
      transform: translateY(34px);
      background: linear-gradient(90deg, #5A2CFC 0%, #D8DEFF 100%);
      background-repeat: no-repeat;
      background-size: var(--brand-word-width, 100%) 100%;
      background-position: calc(var(--brand-char-left, 0px) * -1) 0;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      will-change: transform, opacity;
      transition: transform 820ms cubic-bezier(0.22, 1, 0.36, 1), opacity 760ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .brand-prelude-char::after {
      content: attr(data-char);
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      pointer-events: none;
      white-space: pre;
      opacity: 0;
      color: transparent;
      -webkit-text-stroke: 1px rgba(255, 255, 255, 0.5);
      text-shadow: none;
      transition: opacity 220ms ease;
    }

    .brand-prelude-char::before {
      content: attr(data-char);
      position: absolute;
      top: 0;
      left: 0;
      z-index: -1;
      pointer-events: none;
      white-space: pre;
      opacity: 0;
      background-image: linear-gradient(90deg, rgba(90, 44, 252, 0.52) 0%, rgba(216, 222, 255, 0.62) 100%);
      background-repeat: no-repeat;
      background-size: var(--brand-word-width, 100%) 100%;
      background-position: calc(var(--brand-char-left, 0px) * -1) 0;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      filter: blur(24px);
      transform: scale(0.88);
      transition: opacity 420ms ease, transform 1100ms cubic-bezier(0.22, 1, 0.36, 1), filter 900ms ease;
    }

    .brand-prelude-char.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .brand-prelude-text.is-ready:hover .brand-prelude-char::before {
      opacity: 1;
      filter: blur(32px);
      transform: scale(1.18);
      animation: brand-prelude-glow-breathe 2200ms ease-in-out infinite;
    }

    .brand-prelude-text.is-ready:hover .brand-prelude-char::after {
      opacity: 1;
    }

    @keyframes brand-prelude-glow-breathe {
      0% {
        opacity: 0.62;
        transform: scale(1.02);
        filter: blur(24px);
      }
      50% {
        opacity: 1;
        transform: scale(1.22);
        filter: blur(34px);
      }
      100% {
        opacity: 0.72;
        transform: scale(1.08);
        filter: blur(28px);
      }
    }

    @keyframes brand-prelude-click-out {
      0% {
        opacity: 1;
        transform: scale(1);
      }
      100% {
        opacity: 0;
        transform: scale(2.05);
      }
    }

    @media (max-width: 640px) {
      .brand-prelude-text {
        max-width: calc(100vw - 36px);
        font-size: 46px;
      }
    }

    @media (min-width: 641px) and (max-width: 960px) {
      .brand-prelude-text {
        font-size: 72px;
      }
    }
  </style>
</head>
<body>
  <main id="brand-prelude" aria-label="Facemini">
    <div id="brand-prelude-burst" aria-hidden="true"></div>
    <div class="brand-prelude-text" data-brand-text="Facemini" aria-label="Facemini">Facemini</div>
  </main>
  <script>
    (() => {
      const prelude = document.getElementById("brand-prelude");
      const textNode = document.querySelector(".brand-prelude-text");
      const brandCharStaggerMs = 65;
      const brandPreludeDelayMs = 120;
      const brandClickOutDelayMs = 720;
      let brandCharTimers = [];
      let clickEffectStarted = false;
      let navigationStarted = false;

      const clearBrandCharTimers = () => {
        brandCharTimers.forEach((timer) => window.clearTimeout(timer));
        brandCharTimers = [];
      };

      const prepareBrandPrelude = () => {
        if (!textNode) return [];
        const text = textNode.getAttribute("data-brand-text") || textNode.textContent || "";
        textNode.textContent = "";
        const chars = Array.from(text).map((character) => {
          const span = document.createElement("span");
          span.className = "brand-prelude-char";
          span.textContent = character === " " ? "\u00A0" : character;
          span.setAttribute("data-char", character === " " ? "\u00A0" : character);
          textNode.appendChild(span);
          return span;
        });
        const wordWidth = textNode.getBoundingClientRect().width;
        textNode.style.setProperty("--brand-word-width", `${wordWidth}px`);
        chars.forEach((char) => {
          char.style.setProperty("--brand-char-left", `${char.offsetLeft}px`);
        });
        return chars;
      };

      const runBrandPrelude = () => {
        const chars = prepareBrandPrelude();
        if (!textNode || !chars.length) return;
        clearBrandCharTimers();
        textNode.classList.remove("is-ready");
        textNode.classList.add("is-visible");
        chars.forEach((char, index) => {
          const timer = window.setTimeout(() => {
            char.classList.add("is-visible");
          }, brandPreludeDelayMs + index * brandCharStaggerMs);
          brandCharTimers.push(timer);
        });
        const readyTimer = window.setTimeout(() => {
          textNode.classList.add("is-ready");
        }, brandPreludeDelayMs + (chars.length - 1) * brandCharStaggerMs + 860);
        brandCharTimers.push(readyTimer);
      };

      const playClickEffect = () => {
        if (clickEffectStarted) return;
        clickEffectStarted = true;
        textNode?.classList.add("is-clicked");
      };

      runBrandPrelude();
      const openStudio = (event) => {
        if (navigationStarted || event.defaultPrevented || event.button > 0) return;
        event.preventDefault();
        event.stopPropagation();
        navigationStarted = true;
        playClickEffect();
        window.setTimeout(() => {
          prelude?.classList.add("is-hidden");
          window.location.href = "./studio.html";
        }, brandClickOutDelayMs);
      };
      window.addEventListener("pointerdown", playClickEffect, { once: true });
      window.addEventListener("click", openStudio, true);
      window.addEventListener("pagehide", clearBrandCharTimers, { once: true });
    })();
  </script>
    <script type="module" data-brand-prelude-burst-script>
      import { Renderer, Program, Mesh, Triangle, Texture } from "./assets/vendor/ogl.mjs";

      const vertexShader = `#version 300 es
in vec2 position;
in vec2 uv;
out vec2 vUv;
void main() {
  vUv = uv;
  gl_Position = vec4(position, 0.0, 1.0);
}
`;

      const fragmentShader = `#version 300 es
precision highp float;
precision highp int;

out vec4 fragColor;

uniform vec2  uResolution;
uniform float uTime;
uniform float uIntensity;
uniform float uSpeed;
uniform int   uAnimType;
uniform vec2  uMouse;
uniform int   uColorCount;
uniform float uDistort;
uniform vec2  uOffset;
uniform sampler2D uGradient;
uniform float uNoiseAmount;
uniform int   uRayCount;

float hash21(vec2 p){
  p = floor(p);
  float f = 52.9829189 * fract(dot(p, vec2(0.065, 0.005)));
  return fract(f);
}

mat2 rot30(){ return mat2(0.8, -0.5, 0.5, 0.8); }

float layeredNoise(vec2 fragPx){
  vec2 p = mod(fragPx + vec2(uTime * 30.0, -uTime * 21.0), 1024.0);
  vec2 q = rot30() * p;
  float n = 0.0;
  n += 0.40 * hash21(q);
  n += 0.25 * hash21(q * 2.0 + 17.0);
  n += 0.20 * hash21(q * 4.0 + 47.0);
  n += 0.10 * hash21(q * 8.0 + 113.0);
  n += 0.05 * hash21(q * 16.0 + 191.0);
  return n;
}

vec3 rayDir(vec2 frag, vec2 res, vec2 offset, float dist){
  float focal = res.y * max(dist, 1e-3);
  return normalize(vec3(2.0 * (frag - offset) - res, focal));
}

float edgeFade(vec2 frag, vec2 res, vec2 offset){
  vec2 toC = frag - 0.5 * res - offset;
  float r = length(toC) / (0.5 * min(res.x, res.y));
  float x = clamp(r, 0.0, 1.0);
  float q = x * x * x * (x * (x * 6.0 - 15.0) + 10.0);
  float s = q * 0.5;
  s = pow(s, 1.5);
  float tail = 1.0 - pow(1.0 - s, 2.0);
  s = mix(s, tail, 0.2);
  float dn = (layeredNoise(frag * 0.15) - 0.5) * 0.0015 * s;
  return clamp(s + dn, 0.0, 1.0);
}

mat3 rotX(float a){ float c = cos(a), s = sin(a); return mat3(1.0,0.0,0.0, 0.0,c,-s, 0.0,s,c); }
mat3 rotY(float a){ float c = cos(a), s = sin(a); return mat3(c,0.0,s, 0.0,1.0,0.0, -s,0.0,c); }
mat3 rotZ(float a){ float c = cos(a), s = sin(a); return mat3(c,-s,0.0, s,c,0.0, 0.0,0.0,1.0); }

vec3 sampleGradient(float t){
  t = clamp(t, 0.0, 1.0);
  return texture(uGradient, vec2(t, 0.5)).rgb;
}

vec2 rot2(vec2 v, float a){
  float s = sin(a), c = cos(a);
  return mat2(c, -s, s, c) * v;
}

float bendAngle(vec3 q, float t){
  float a = 0.8 * sin(q.x * 0.55 + t * 0.6)
          + 0.7 * sin(q.y * 0.50 - t * 0.5)
          + 0.6 * sin(q.z * 0.60 + t * 0.7);
  return a;
}

void main(){
  vec2 frag = gl_FragCoord.xy;
  float t = uTime * uSpeed;
  float jitterAmp = 0.1 * clamp(uNoiseAmount, 0.0, 1.0);
  vec3 dir = rayDir(frag, uResolution, uOffset, 1.0);
  float marchT = 0.0;
  vec3 col = vec3(0.0);
  float n = layeredNoise(frag);
  vec4 c = cos(t * 0.2 + vec4(0.0, 33.0, 11.0, 0.0));
  mat2 M2 = mat2(c.x, c.y, c.z, c.w);
  float amp = clamp(uDistort, 0.0, 50.0) * 0.15;

  mat3 rot3dMat = mat3(1.0);
  if(uAnimType == 1){
    vec3 ang = vec3(t * 0.31, t * 0.21, t * 0.17);
    rot3dMat = rotZ(ang.z) * rotY(ang.y) * rotX(ang.x);
  }
  mat3 hoverMat = mat3(1.0);
  if(uAnimType == 2){
    vec2 m = uMouse * 2.0 - 1.0;
    vec3 ang = vec3(m.y * 0.6, m.x * 0.6, 0.0);
    hoverMat = rotY(ang.y) * rotX(ang.x);
  }

  for (int i = 0; i < 44; ++i) {
    vec3 P = marchT * dir;
    P.z -= 2.0;
    float rad = length(P);
    vec3 Pl = P * (10.0 / max(rad, 1e-6));

    if(uAnimType == 0){
      Pl.xz *= M2;
    } else if(uAnimType == 1){
      Pl = rot3dMat * Pl;
    } else {
      Pl = hoverMat * Pl;
    }

    float stepLen = min(rad - 0.3, n * jitterAmp) + 0.1;

    float grow = smoothstep(0.35, 3.0, marchT);
    float a1 = amp * grow * bendAngle(Pl * 0.6, t);
    float a2 = 0.5 * amp * grow * bendAngle(Pl.zyx * 0.5 + 3.1, t * 0.9);
    vec3 Pb = Pl;
    Pb.xz = rot2(Pb.xz, a1);
    Pb.xy = rot2(Pb.xy, a2);

    float rayPattern = smoothstep(
      0.5, 0.7,
      sin(Pb.x + cos(Pb.y) * cos(Pb.z)) *
      sin(Pb.z + sin(Pb.y) * cos(Pb.x + t))
    );

    if (uRayCount > 0) {
      float ang = atan(Pb.y, Pb.x);
      float comb = 0.5 + 0.5 * cos(float(uRayCount) * ang);
      comb = pow(comb, 3.0);
      rayPattern *= smoothstep(0.15, 0.95, comb);
    }

    vec3 spectralDefault = 1.0 + vec3(
      cos(marchT * 3.0 + 0.0),
      cos(marchT * 3.0 + 1.0),
      cos(marchT * 3.0 + 2.0)
    );

    float saw = fract(marchT * 0.25);
    float tRay = saw * saw * (3.0 - 2.0 * saw);
    vec3 userGradient = 2.0 * sampleGradient(tRay);
    vec3 spectral = (uColorCount > 0) ? userGradient : spectralDefault;
    vec3 base = (0.05 / (0.4 + stepLen))
              * smoothstep(5.0, 0.0, rad)
              * spectral;

    col += base * rayPattern;
    marchT += stepLen;
  }

  col *= edgeFade(frag, uResolution, uOffset);
  col *= uIntensity;

  fragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;

      const hexToRgb01 = (hex) => {
        let value = String(hex).trim();
        if (value.startsWith("#")) value = value.slice(1);
        if (value.length === 3) {
          value = value.split("").map((char) => char + char).join("");
        }
        const intValue = Number.parseInt(value, 16);
        if (Number.isNaN(intValue) || (value.length !== 6 && value.length !== 8)) {
          return [1, 1, 1];
        }
        return [
          ((intValue >> 16) & 255) / 255,
          ((intValue >> 8) & 255) / 255,
          (intValue & 255) / 255
        ];
      };

      try {
        const burstContainer = document.getElementById("brand-prelude-burst");
        if (!burstContainer) {
          throw new Error("Missing #brand-prelude-burst container.");
        }

        const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
        const renderer = new Renderer({
          dpr,
          alpha: false,
          antialias: false
        });
        const { gl } = renderer;
        if (!(gl instanceof WebGL2RenderingContext)) {
          throw new Error("PrismaticBurst requires WebGL2.");
        }

        gl.canvas.setAttribute("aria-hidden", "true");
        gl.canvas.style.position = "absolute";
        gl.canvas.style.inset = "0";
        gl.canvas.style.width = "100%";
        gl.canvas.style.height = "100%";
        gl.canvas.style.opacity = "0.96";
        gl.canvas.style.mixBlendMode = "lighten";
        burstContainer.appendChild(gl.canvas);

        const white = new Uint8Array([255, 255, 255, 255]);
        const gradientTexture = new Texture(gl, {
          image: white,
          width: 1,
          height: 1,
          generateMipmaps: false,
          flipY: false
        });
        gradientTexture.minFilter = gl.LINEAR;
        gradientTexture.magFilter = gl.LINEAR;
        gradientTexture.wrapS = gl.CLAMP_TO_EDGE;
        gradientTexture.wrapT = gl.CLAMP_TO_EDGE;

        const program = new Program(gl, {
          vertex: vertexShader,
          fragment: fragmentShader,
          uniforms: {
            uResolution: { value: [1, 1] },
            uTime: { value: 0 },
            uIntensity: { value: 2.2 },
            uSpeed: { value: 0.82 },
            uAnimType: { value: 1 },
            uMouse: { value: [0.5, 0.5] },
            uColorCount: { value: 0 },
            uDistort: { value: 1.08 },
            uOffset: { value: [0, 0] },
            uGradient: { value: gradientTexture },
            uNoiseAmount: { value: 0.2 },
            uRayCount: { value: 13 }
          }
        });

        const triangle = new Triangle(gl);
        const mesh = new Mesh(gl, { geometry: triangle, program });

        const colors = ["#5A2CFC", "#AD6CFC", "#D8DEFF"];
        const gradientData = new Uint8Array(colors.length * 4);
        colors.forEach((hex, index) => {
          const [r, g, b] = hexToRgb01(hex);
          gradientData[index * 4] = Math.round(r * 255);
          gradientData[index * 4 + 1] = Math.round(g * 255);
          gradientData[index * 4 + 2] = Math.round(b * 255);
          gradientData[index * 4 + 3] = 255;
        });
        gradientTexture.image = gradientData;
        gradientTexture.width = colors.length;
        gradientTexture.height = 1;
        gradientTexture.format = gl.RGBA;
        gradientTexture.type = gl.UNSIGNED_BYTE;
        gradientTexture.flipY = false;
        gradientTexture.generateMipmaps = false;
        gradientTexture.needsUpdate = true;
        program.uniforms.uColorCount.value = colors.length;

        const mouseTarget = [0.5, 0.5];
        const mouseSmooth = [0.5, 0.5];
        let visible = true;
        let rafId = 0;
        let lastTime = performance.now();
        let lastRenderTime = 0;
        let elapsed = 0;
        const minRenderIntervalMs = 1000 / 30;

        const resize = () => {
          const width = burstContainer.clientWidth || 1;
          const height = burstContainer.clientHeight || 1;
          renderer.setSize(width, height);
          program.uniforms.uResolution.value = [gl.drawingBufferWidth, gl.drawingBufferHeight];
        };

        const updateOffset = () => {
          program.uniforms.uOffset.value = [0, 0];
        };

        const onPointerMove = (event) => {
          const rect = burstContainer.getBoundingClientRect();
          const x = (event.clientX - rect.left) / Math.max(rect.width, 1);
          const y = (event.clientY - rect.top) / Math.max(rect.height, 1);
          mouseTarget[0] = Math.min(Math.max(x, 0), 1);
          mouseTarget[1] = Math.min(Math.max(y, 0), 1);
        };

        const resizeObserver = "ResizeObserver" in window
          ? new ResizeObserver(() => {
              resize();
              updateOffset();
            })
          : null;
        resizeObserver?.observe(burstContainer);
        if (!resizeObserver) {
          window.addEventListener("resize", resize, { passive: true });
          window.addEventListener("resize", updateOffset, { passive: true });
        }

        const intersectionObserver = "IntersectionObserver" in window
          ? new IntersectionObserver((entries) => {
              if (entries[0]) visible = entries[0].isIntersecting;
            }, { threshold: 0.01 })
          : null;
        intersectionObserver?.observe(burstContainer);

        burstContainer.addEventListener("pointermove", onPointerMove, { passive: true });
        window.addEventListener("pointermove", onPointerMove, { passive: true });

        const tick = (now) => {
          const dt = Math.max(0, now - lastTime) * 0.001;
          lastTime = now;

          if (!document.hidden) {
            elapsed += dt;
          }

          if (visible && !document.hidden && now - lastRenderTime >= minRenderIntervalMs) {
            lastRenderTime = now;
            const alpha = 1 - Math.exp(-dt / 0.18);
            mouseSmooth[0] += (mouseTarget[0] - mouseSmooth[0]) * alpha;
            mouseSmooth[1] += (mouseTarget[1] - mouseSmooth[1]) * alpha;
            program.uniforms.uMouse.value = mouseSmooth;
            program.uniforms.uTime.value = elapsed;
            renderer.render({ scene: mesh });
          }

          rafId = window.requestAnimationFrame(tick);
        };

        const cleanup = () => {
          window.cancelAnimationFrame(rafId);
          burstContainer.removeEventListener("pointermove", onPointerMove);
          window.removeEventListener("pointermove", onPointerMove);
          if (!resizeObserver) {
            window.removeEventListener("resize", resize);
            window.removeEventListener("resize", updateOffset);
          }
          resizeObserver?.disconnect();
          intersectionObserver?.disconnect();
          try {
            mesh.remove?.();
            triangle.remove?.();
            program.remove?.();
            if (gradientTexture.texture) {
              gl.deleteTexture(gradientTexture.texture);
            }
            burstContainer.removeChild(gl.canvas);
          } catch (error) {
            console.warn("Failed to clean up prelude burst:", error);
          }
        };

        window.addEventListener("pagehide", cleanup, { once: true });

        resize();
        updateOffset();
        rafId = window.requestAnimationFrame(tick);
      } catch (error) {
        console.warn("PrismaticBurst fallback active:", error);
      }
    </script>

</body>
</html>
