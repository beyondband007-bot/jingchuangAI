      <stop offset="0%" stop-color="#f8f8ff"/>
      <stop offset="50%" stop-color="#f0ecff"/>
      <stop offset="100%" stop-color="#e8e4ff"/>
    </linearGradient>

    <!-- Glass card fill -->
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.78"/>
