services:
  mysql:
    image: mysql:8.4
    container_name: jingchuang-ai-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: jingchuang_dev_password
      MYSQL_DATABASE: jingchuang_ai
    volumes:
      - jingchuang_ai_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pjingchuang_dev_password"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  jingchuang_ai_mysql_data:
