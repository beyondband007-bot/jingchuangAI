services:
  backend:
    ports:
      - "${BACKEND_DEV_BIND_ADDRESS:-127.0.0.1}:${BACKEND_DEV_PORT:-3006}:3006"

  frontend-dev:
    image: node:22-alpine
    working_dir: /app
    command: sh -lc "npm ci && npm run dev:lan -- --port 5173 --strictPort"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_DEV_PROXY_TARGET: http://host.docker.internal:3006
      CHOKIDAR_USEPOLLING: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${FRONTEND_DEV_BIND_ADDRESS:-0.0.0.0}:${FRONTEND_DEV_PORT:-5173}:5173"
    volumes:
      - ./frontend-app:/app
      - frontend_dev_node_modules:/app/node_modules

volumes:
  frontend_dev_node_modules:
